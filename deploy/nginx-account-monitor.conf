# /etc/nginx/conf.d/account-monitor.conf
#
# 关键点：
#   proxy_pass 后面不要带 URI（不要写成 http://.../），
#   这样 Nginx 会把 /account-monitor/... 原样转给 Node。
#   应用自身的 basepath 就是 /account-monitor。

upstream changan_monitor_web {
    server 127.0.0.1:3001;
    keepalive 32;
}

server {
    listen 80;
    server_name your-domain.com;

    # 统一带斜杠
    location = /account-monitor {
        return 301 /account-monitor/;
    }

    location /account-monitor/ {
        proxy_pass http://changan_monitor_web;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 2m;
    }
}

# 如果已经有 HTTPS server 块，把两个 location 复制进去即可。
# 注意 PUBLIC_ORIGIN 要写浏览器实际访问的 scheme + host，例如：
#   PUBLIC_ORIGIN=https://your-domain.com
